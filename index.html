<head>

<title>Card Gallery</title>
<style>
  body{background:black; font-family:Arial, sans-serif; margin:0; min-height:100vh; display:flex; align-items:center;}
  .container{display:flex; flex-wrap:wrap; gap:30px; padding:30px; justify-content:center; width:100%;}
  .card{width:250px; padding:25px; text-align:center; border-radius:30px; color:white;
    background:linear-gradient(150deg,#1a1a1a,#2e2e2e);
    box-shadow:4px 4px 10px hotpink; transition:0.5s;}
  .card:hover{transform:translateY(10px) scale(1.2); box-shadow:0 20px 40px hotpink;}
  .book-img{width:100%; border-radius:20px; display:block;}
  .title{font-size:25px; transition:0.5s;}
  .card:hover .title{color:hotpink; transform:translateY(-5px) scale(1.15); letter-spacing:3px;
    text-shadow:0 0 10px hotpink, 0 0 20px hotpink, 0 0 40px hotpink;}
  .value{font-size:40px; font-weight:bold; text-shadow:2px 2px 5px hotpink; transition:0.5s;}
  .card:hover .value{color:hotpink; transform:translateY(-8px) scale(1.2);
    text-shadow:0 0 10px hotpink, 0 0 20px hotpink, 0 0 40px hotpink;}
  button{margin-top:20px; padding:12px 25px; border:none; border-radius:30px; background:hotpink; color:white;
    font-size:16px; font-weight:bold; cursor:pointer; transition:0.3s;}
  button:hover{background:green; color:hotpink; transform:scale(1.1);}
</style>
